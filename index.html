<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#21091f" />
    <title>Happy 26th Birthday, Maria! ✨</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div id="confetti" aria-hidden="true"></div>
    <main>
      <section class="message" aria-label="Birthday message">
        <p class="date">October 4 <span>✦</span></p>
        <h1>Happy 26th<br />Birthday, Maria!</h1>
        <p class="copy">26 looks amazing on you my sweet potato. You make every little moment brighter, warmer, and magical. I’m so lucky to have you 🌈☁️</p>
        <p class="love">With all my love <span>♡</span></p>
      </section>
      <button id="surprise" type="button">Tap for more magic ✨</button>
    </main>
    <div id="photos" aria-hidden="true"></div>
    <p class="hint">Photos from us, popping up just for you</p>
    <script src="script.js"></script>
  </body>
</html>
